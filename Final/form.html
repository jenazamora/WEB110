<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquarian Adoption</title>
    <link rel="stylesheet" href="styles.css">
    <style>body{background-image:url(wata.jpg)}</style>
</head>
<body>

<div class="wrapper">
    <header>
        Aquarian Adoption
        <h6>The only place to adopt your own sea creature!</h6>
    </header>

<nav>
    <ul>
        <li> <a href="final.html">Home</a> </li>
        <li><a href="info.html">Creatures</a> </li>
        <li><a href="form.html">Adopt Here</a></li>
    </ul>      
</nav>

<main>
<form method="post" action="https://webdevbasics.net/scripts/demo.php">
<div class="container">
<p>Thank you so much for your interest! Please take this short form and we'll be in touch!<br></p>

<div class="form-group">
  <label for="fname">First Name:</label>
  <input type="text" id="fname" name="first name" maxlength="30" required>
</div>

<div class="form-group">
  <label for="lname">Last Name:</label>
  <input type="text" id="lname" name="last name" maxlength="30" required>
</div>

<div class="form-group">
 <label for="birthday">Birthday:</label>
  <input type="date" id="birthday" name="birthday" required>
</div>

<div class="form-group">
  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required>
</div>

<div class="form-group">
  <label for="phone">Phone:</label>
  <input type="tel" id="phone" name="phone" placeholder="123-456-7890" required>
</div>

<div class="radio-group">
    <label>Which creature are you interested in?</label>
    <div class="interest-options">
    <div class="radio-option">
        <label>
      <input type="radio" name="interest" value="seahorse" required>
      Seahorse
    </label>
</div>
<div class="radio-option">
    <label>
      <input type="radio" name="interest" value="turtle">
      Turtle
    </label>
</div>
<div class="radio-option">
    <label>
      <input type="radio" name="interest" value="jellyfish">
      Jellyfish
    </label>
</div>
<div class="radio-option">
    <label>
      <input type="radio" name="interest" value="starfish">
      Starfish
    </label>
</div>
</div>


<div class="group">
    <label>Have you read and understood what you would need for these animals and are you willing to comply?</label>
    <div class="comply-options">
    <div class="radio-option">
        <label>
      <input type="radio" name="comply" value="yes" required>
      Yes
    </label>
</div>
<div class="radio-option">
    <label>
      <input type="radio" name="comply" value="no">
      No
    </label>
</div>
</div>
 
<div class="buttons-group">
  <button type="submit">Submit</button>
  <button type="reset">Reset</button>
</div>
</div>
</form>
</main>




<footer>
    &copy; 2026 Aquarian Adoption
</footer>

</div>
</body>
</html>

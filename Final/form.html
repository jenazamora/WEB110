<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquarian Adoption</title>
    <link rel="stylesheet" href="styles.css">
    <style>body{background-image:url(wata.jpg)}</style>
</head>
<body>

<div class="wrapper">
    <header>
        Aquarian Adoption
        <h6>The only place to adopt your own sea creature!</h6>
    </header>

<nav>
    <ul>
        <li> <a href="final.html">Home</a> </li>
        <li><a href="info.html">Creatures</a> </li>
        <li><a href="form.html">Adopt Here</a></li>
    </ul>      
</nav>

<main>  
<div class="container">

<p>Thank you so much for your interest! Please take this short form and we'll be in touch!<br></p>
<form>    
<div class="form-group">
  <label for="fname">First Name:</label>
  <input type="text" id="fname" name="firstname" maxlength="30" required>
</div>

<div class="form-group">
  <label for="lname">Last Name:</label>
  <input type="text" id="lname" name="lastname" maxlength="30" required>
</div>


<div class="form-group">
  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required>
</div>

<div class="form-group">
  <label for="phone">Phone Number:</label>
  <input type="tel" id="phone" name="phone" placeholder="(123) 456-7890">
</div>

<div class="form-group">
    <label>Which creature are you interested in?</label>
    <div class="contact-options">
    <div class="radio-option">
        <label>
      <input type="radio" name="contact" value="email" required>
      Turtle
    </label>
</div>
<div class="radio-option">
    <label>
      <input type="radio" name="contact" value="phone">
      Seahorse
    </label>
</div>
<div class="radio-option">
    <label>
      <input type="radio" name="contact" value="text">
      Jellyfish
    </label>
</div>
<div class="radio-option">
    <label>
      <input type="radio" name="contact" value="none">
      Starfish
    </label>
</div>
</div>
</div>
 
<div class="form-group">
  <button type="submit">Submit</button>
</div>
</form>
</main>




<footer>
    &copy; 2026 Aquarian Adoption
</footer>

</div>
</body>
</html>
